<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>SST | ION</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SST ION">
<style>
  :root{ --ink:#1a1a1a; --green:#76b82a; --line:#e3e5ea; --muted:#6b7280 }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:#f4f5f7; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; overflow:hidden}
  .app{display:flex; flex-direction:column; height:100vh; height:100dvh}
  .tabs{flex:0 0 auto; display:flex; gap:6px; padding:calc(6px + env(safe-area-inset-top)) 8px 6px; background:var(--ink)}
  .tabs button{flex:1; min-width:0; border:none; border-radius:10px; padding:10px 6px; font-family:inherit; font-size:13px; font-weight:800; line-height:1.15; color:#cfd2d8; background:#2c2c2e; cursor:pointer}
  .tabs button small{display:block; font-weight:600; font-size:10.5px; opacity:.8; margin-top:2px}
  .tabs button.on{background:var(--green); color:#fff}
  .frames{flex:1; position:relative; min-height:0; background:#fff}
  .frames iframe{position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; display:none}
  .frames iframe.on{display:block}
  .ld{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <div class="tabs">
    <button type="button" id="tab_ast" onclick="go('ast')">📝 AST y Permisos<small>AST · Permisos de trabajo</small></button>
    <button type="button" id="tab_obs" onclick="go('obs')">🦺 Inspecciones y Reportes<small>Observaciones · Check list</small></button>
  </div>
  <div class="frames">
    <div class="ld" id="ld">Cargando…</div>
    <iframe id="fr_ast" title="AST y Permisos de trabajo" allow="web-share; camera; clipboard-write"></iframe>
    <iframe id="fr_obs" title="Observaciones, Near Miss y Check list" allow="web-share; camera; clipboard-write"></iframe>
  </div>
</div>
<script>
  var SRC={ast:'ast.html', obs:'Observaciones/index.html'};
  var KEY='ion_hub_tab';
  function lsGet(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function lsSet(v){ try{ localStorage.setItem(KEY,v); }catch(e){} }
  function go(t){
    if(!SRC[t]) t='ast';
    ['ast','obs'].forEach(function(k){
      var f=document.getElementById('fr_'+k), on=(k===t);
      if(on && !f.getAttribute('src')){
        f.setAttribute('src',SRC[k]);
        f.addEventListener('load',function(){ var l=document.getElementById('ld'); if(l) l.style.display='none'; },{once:true});
      }
      f.classList.toggle('on',on);
      document.getElementById('tab_'+k).classList.toggle('on',on);
    });
    lsSet(t);
    try{ history.replaceState(null,'','#'+t); }catch(e){}
  }
  (function(){
    var h=(location.hash||'').replace('#','');
    go(SRC[h]?h:(SRC[lsGet()]?lsGet():'ast'));
  })();
  window.addEventListener('hashchange',function(){ var h=location.hash.replace('#',''); if(SRC[h]) go(h); });
</script>
</body>
</html>
